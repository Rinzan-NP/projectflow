name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from going to sleep (spins down after 15m)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          URLS=(
            "https://projectflow-api-sgm3.onrender.com/api/health"
            "https://projectflow-api-sgm3.onrender.com/api/telegram/status"
          )
          for URL in "${URLS[@]}"; do
            echo "Pinging $URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "$URL -> HTTP $STATUS"
          done
