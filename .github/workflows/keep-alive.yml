name: Keep Render Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render free tier from going to sleep (spins down after 15m)
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          URL="https://projectflow-api-sgm3.onrender.com/api/health"
          echo "Pinging $URL to keep Render backend awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP Status Code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Render backend is awake and healthy!"
          else
            echo "Ping sent (Status: $RESPONSE)"
          fi
