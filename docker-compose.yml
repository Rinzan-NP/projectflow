services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: projectflow-backend:latest
    container_name: projectflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/dev.db
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: projectflow-frontend:latest
    container_name: projectflow_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
