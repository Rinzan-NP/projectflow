app = "projectflow"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/app/data/dev.db"
  SEED_DB = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "projectflow_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
